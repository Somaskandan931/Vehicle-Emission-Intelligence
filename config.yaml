# ---------------------------------------------------------------
# Master config: global settings + VEEI / DEHS parameters.
# Merged at load time with:
#   configs/data.yaml                 data + split
#   configs/<uni|bi|hybrid>_lstm.yaml model + training (+ lambda for hybrid)
# Every value that appears in the paper must come from these files.
# Values marked "starting default" are NOT tuned yet - record the
# final ones you actually use in experiments/README.md.
# ---------------------------------------------------------------
seed: 42

# Hardware. Training requires a GPU by default: it stops with a clear error instead of
# silently falling back to a slow CPU run.
#   device: gpu   -> CUDA (NVIDIA) or MPS (Apple silicon); error if neither is available
#   device: cuda | mps | cpu | auto (auto = best available, CPU allowed)
compute:
  device: gpu
  amp: false            # mixed precision (CUDA only); leave false for the paper runs unless needed
  num_workers: 0        # DataLoader workers; keep 0 on Windows

paths:
  processed: data/processed
  experiments: experiments
  checkpoints: models/checkpoints
  metrics: results/metrics
  predictions: results/predictions
  ablation: results/ablation
  tables: results/tables
  figures: results/figures

# VEEI / DEHS parameters must be sourced and documented.
# Limits are regulatory g/km values converted to g/s at a 50 km/h reference speed
# (g/s = g/km * 50 / 3600). Verify against the regulation text before citing.
veei:
  limits:  {CO: 0.013889, HC: null, NOx: 0.000833, CO2: 1.319, SO2: null, PM: null}
  weights: {CO: 0.3333, HC: null, NOx: 0.3333, CO2: 0.3333, SO2: null, PM: null}
  units:   {CO: "g/s", HC: "", NOx: "g/s", CO2: "g/s", SO2: "", PM: ""}
  sources:
    CO:  "Euro 6 / BS-VI petrol passenger car limit 1.0 g/km, converted to g/s at 50 km/h reference speed"
    HC:  ""
    NOx: "Euro 6 / BS-VI petrol passenger car limit 0.06 g/km, converted to g/s at 50 km/h reference speed"
    CO2: "EU fleet-average target 95 g/km, converted to g/s at 50 km/h reference speed"
    SO2: ""
    PM:  ""
dehs:
  beta: 0.6931
  justification: "beta = ln 2 so a vehicle emitting exactly at the reference limits scores DEHS = 50; equal pollutant weights, sensitivity reported."
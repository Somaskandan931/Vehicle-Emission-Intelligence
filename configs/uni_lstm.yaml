# Starting defaults. Keep model/training identical across uni/bi/hybrid configs
# unless you can justify the difference in the paper (fair ablation).
model:
  hidden_units: 64
  layers: 1
  dropout: 0.0

training:
  epochs: 100
  batch_size: 64
  learning_rate: 0.001
  weight_decay: 0.0
  patience: 12
  grad_clip: 1.0

<!doctype html>
<html><head><meta charset="utf-8"><title>Vehicle Emission Intelligence</title>
<style>body{font-family:system-ui;margin:2rem}table{border-collapse:collapse}td,th{border:1px solid #ccc;padding:.4rem .8rem}</style></head>
<body><h1>Vehicle Emission Intelligence</h1>
<table><tr><th>Vehicle</th><th>Mean predicted VEEI</th><th>Mean predicted DEHS</th></tr>
{% for r in rows %}<tr><td><a href="/api/vehicle/{{ r.vehicle_id }}">{{ r.vehicle_id }}</a></td><td>{{ r.VEEI }}</td><td>{{ r.DEHS }}</td></tr>{% endfor %}
</table></body></html>
